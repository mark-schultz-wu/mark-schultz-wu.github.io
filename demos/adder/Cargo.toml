[package]
name = "adder"
version = "0.1.0"
edition = "2021"
publish = false

# Placeholder Rust->wasm demo. Compiled by `just demos` into
# static/demos/adder/ and embedded in a post with {{ demo(name="adder") }}.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "Document", "Element", "HtmlElement", "HtmlInputElement",
  "Window", "Event", "Node",
]

[profile.release]
opt-level = "s"
lto = true
