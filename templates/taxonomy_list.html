{% extends "base.html" %}

{% block title %}{{ taxonomy.name | capitalize }} – {{ config.title }}{% endblock title %}

{% block content %}
<section class="taxonomy">
  <h1>{{ taxonomy.name | capitalize }}</h1>
  <ul class="term-list">
    {% for term in terms %}
      <li>
        <a href="{{ term.permalink | safe }}">{{ term.name }}</a>
        <span class="count">{{ term.pages | length }}</span>
      </li>
    {% endfor %}
  </ul>
</section>
{% endblock content %}
